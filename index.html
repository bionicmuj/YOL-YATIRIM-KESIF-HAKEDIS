<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f4d36">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Yeni Yol Saha Tespit</title>
<style>
/* ---- Leaflet çekirdek stilleri (çevrimdışı çalışsın diye gömülü) ---- */
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;-webkit-tap-highlight-color:transparent;background:#e6e2d6;outline:0}
.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow{-webkit-user-select:none;user-select:none;-webkit-user-drag:none}
.leaflet-container img.leaflet-tile{max-width:none!important;max-height:none!important;mix-blend-mode:normal}
.leaflet-tile{filter:inherit;visibility:hidden}.leaflet-tile-loaded{visibility:inherit}
.leaflet-container.leaflet-touch-zoom,.leaflet-container.leaflet-touch-drag{touch-action:none}
.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-shadow-pane{z-index:500}.leaflet-marker-pane{z-index:600}.leaflet-tooltip-pane{z-index:650}.leaflet-popup-pane{z-index:700}
.leaflet-map-pane canvas{z-index:100}.leaflet-map-pane svg{z-index:200}
.leaflet-zoom-animated{transform-origin:0 0}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-zoom-anim .leaflet-tile,.leaflet-pan-anim .leaflet-tile{transition:none}
.leaflet-zoom-anim .leaflet-zoom-hide{visibility:hidden}
.leaflet-interactive{cursor:pointer}
.leaflet-pane>svg path{pointer-events:none}.leaflet-pane>svg path.leaflet-interactive{pointer-events:auto}
.leaflet-control{position:relative;z-index:800;pointer-events:auto;float:left;clear:both}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}
.leaflet-top{top:0}.leaflet-right{right:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}
.leaflet-right .leaflet-control{float:right}
.leaflet-top .leaflet-control{margin-top:10px}.leaflet-bottom .leaflet-control{margin-bottom:6px}
.leaflet-left .leaflet-control{margin-left:10px}.leaflet-right .leaflet-control{margin-right:6px}
.leaflet-bar{box-shadow:0 1px 5px rgba(0,0,0,.4);border-radius:6px}
.leaflet-bar a{display:block;width:40px;height:40px;line-height:40px;text-align:center;text-decoration:none;color:#111;background:#fff;font:bold 22px/40px system-ui;border-bottom:1px solid #ccc}
.leaflet-bar a:first-child{border-radius:6px 6px 0 0}.leaflet-bar a:last-child{border-radius:0 0 6px 6px;border-bottom:0}
.leaflet-control-attribution{background:rgba(255,255,255,.75);font-size:10px;padding:0 4px;color:#333}
.leaflet-control-attribution a{color:#333}
.leaflet-div-icon{background:transparent;border:0}

/* ---- Uygulama ---- */
:root{--g:#1f4d36;--g2:#2f6b4c;--g3:#e3eee6;--acc:#d9961a;--bg:#f2f0e9;--card:#fff;--ink:#17201b;--mut:#5b665f;--line:#d8d4c7;--err:#b3261e;--errbg:#fbe9e7;--ok:#2e7d32;--warn:#8a5a00;--warnbg:#fff4d6;--r:12px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:flex;flex-direction:column;height:100%;height:100dvh}
header{background:var(--g);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;font-weight:650;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .sub{font-size:12px;opacity:.8;font-weight:400;display:block}
.pill{font-size:12px;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.16);white-space:nowrap}
.pill.on{background:#c62828;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.6}}
main{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 20px}
nav{display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:9px 4px 8px;font-size:12px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--g);font-weight:650}
nav button:disabled{opacity:.35}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
.card h2{font-size:15px;margin:0 0 8px;color:var(--g)}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.mut{color:var(--mut);font-size:13px}
.btn{border:0;border-radius:10px;padding:12px 14px;font-weight:600;background:var(--g3);color:var(--g);min-height:48px;cursor:pointer}
.btn.p{background:var(--g);color:#fff}
.btn.a{background:var(--acc);color:#fff}
.btn.d{background:var(--errbg);color:var(--err)}
.btn.big{font-size:17px;min-height:56px;width:100%}
.btn:active{filter:brightness(.92)}
.btn:disabled{opacity:.45}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label.f{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input.i,select.i,textarea.i{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;min-height:48px;font-size:17px}
input.i:focus,textarea.i:focus{outline:0;border-color:var(--g2);box-shadow:0 0 0 3px var(--g3)}
input.i.err{border-color:var(--err);background:var(--errbg)}
input.huge{font-size:28px;font-weight:700;text-align:right;min-height:60px;letter-spacing:.5px}
.seg{display:flex;border:1.5px solid var(--g2);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:#fff;color:var(--g);padding:10px 4px;min-height:48px;font-weight:650;font-size:16px}
.seg button+button{border-left:1.5px solid var(--g2)}
.seg button.on{background:var(--g2);color:#fff}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:10px 2px;min-height:48px;font-weight:650;font-size:15px}
.chip.on{background:var(--g);color:#fff;border-color:var(--g)}
.chip.acc{border-color:var(--acc);color:#7a5200}
.chip.acc.on{background:var(--acc);color:#fff}
.zc{text-align:center}
.zc span{display:block;font-size:11px;color:var(--mut);margin-bottom:3px;white-space:nowrap}
.zc input{width:100%;text-align:center;border:1.5px solid var(--line);border-radius:8px;padding:9px 2px;font-size:18px;font-weight:650;min-height:46px}
.tot{display:inline-block;font-weight:700;padding:2px 9px;border-radius:99px;font-size:14px}
.tot.ok{background:#e3f2e5;color:var(--ok)}.tot.no{background:var(--errbg);color:var(--err)}
#map{height:46vh;min-height:260px;border-radius:var(--r);border:1px solid var(--line);overflow:hidden;position:relative}
.mapbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.lst{list-style:none;margin:0;padding:0}
.lst li{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.lst li:last-child{border-bottom:0}
.no{width:30px;height:30px;border-radius:50%;background:var(--g);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none}
.lst .km{font-weight:700;font-variant-numeric:tabular-nums;min-width:86px}
.lst .z{font-size:12px;color:var(--mut);flex:1;min-width:0}
.tag{font-size:11px;font-weight:700;padding:2px 6px;border-radius:5px;background:var(--warnbg);color:var(--warn)}
.tag.e{background:var(--errbg);color:var(--err)}
.mk{width:26px;height:26px;border-radius:50%;background:var(--g);color:#fff;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;font:700 12px system-ui}
.mk.D{background:#1565c0}.mk.KP,.mk.L,.mk.S{background:#8e24aa}.mk.KY{background:var(--acc)}
.me{width:16px;height:16px;border-radius:50%;background:#1e88e5;border:3px solid #fff;box-shadow:0 0 0 2px rgba(30,136,229,.4)}
.msg{padding:10px 12px;border-radius:10px;font-size:14px;margin:6px 0}
.msg.e{background:var(--errbg);color:var(--err)}.msg.w{background:var(--warnbg);color:var(--warn)}.msg.o{background:#e3f2e5;color:var(--ok)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px}
.kv b{font-variant-numeric:tabular-nums}
.bar{display:flex;height:22px;border-radius:6px;overflow:hidden;margin:6px 0 4px;background:#eee}
.bar div{height:100%}
.leg{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px}
.leg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}
details.t{border:1px solid var(--line);border-radius:10px;padding:0 12px;margin-top:12px;background:#fafaf7}
details.t summary{padding:13px 0;font-weight:650;color:var(--g);cursor:pointer}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
/* tam ekran sayfa (nokta girişi vb.) */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:2000;display:flex;flex-direction:column}
.sheet .sh{background:var(--g);color:#fff;padding:calc(env(safe-area-inset-top) + 8px) 8px 8px;display:flex;align-items:center;gap:6px}
.sheet .sh h3{flex:1;margin:0;font-size:17px}
.sheet .sh button{background:none;border:0;color:#fff;font-size:15px;padding:10px;min-width:48px;font-weight:600}
.sheet .sb{flex:1;overflow:auto;padding:12px 12px 24px}
.sheet .sf{padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);background:#fff;border-top:1px solid var(--line);display:flex;gap:8px}
.sheet .sf .btn{flex:1}
.sec{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
.sec>.lbl{font-size:13px;font-weight:700;color:var(--g);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec>.lbl .mut{text-transform:none;letter-spacing:0;font-weight:400}
.quick{display:flex;gap:6px;margin-top:8px}
.quick button{flex:1;min-height:42px;border:1.5px solid var(--line);background:#fff;border-radius:9px;font-weight:650}
.gps{font-size:13px;color:var(--mut);display:flex;align-items:center;gap:8px}
.gps b{color:var(--ink)}
/* diyalog + bildirim */
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:3000;display:flex;align-items:flex-end;justify-content:center}
.dlg>div{background:#fff;border-radius:16px 16px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 14px);width:100%;max-width:560px}
.dlg p{margin:0 0 14px;font-size:16px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 80px);transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:4000;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:.95}
#printArea{display:none}
@media (min-width:700px){main{max-width:760px;margin:0 auto;width:100%}.sheet .sb{max-width:640px;margin:0 auto;width:100%}}
@media print{
  #app,.sheet,.dlg,#toast{display:none!important}
  #printArea{display:block}
  @page{size:A4;margin:10mm}
  body{background:#fff}
}
</style>

<body>
<div id="app">
  <header>
    <h1 id="hTitle">Saha Tespit<span class="sub">Yeni orman yolu</span></h1>
    <span class="pill" id="hIz" hidden>● İZ</span>
    <span class="pill" id="hGps">GPS —</span>
  </header>
  <main id="main"></main>
  <nav id="nav">
    <button data-go="yollar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span class="nl">Yollar</span></button>
    <button data-go="saha"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg><span class="nl">Saha</span></button>
    <button data-go="imalat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/></svg><span class="nl">İmalatlar</span></button>
    <button data-go="ozet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg><span class="nl">Özet</span></button>
  </nav>
</div>
<div id="toast"></div>
<div id="printArea"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
'use strict';
/* =====================================================================
   YENİ YOL SAHA TESPİT — Aşama 1 prototipi (v1.0, 10.11.2026)
   Veri toplama + GPS iz kaydı + Excel / JSON / yazdır + paylaş.
   JSON çıktısı tespit_aktar.py'nin okuduğu HK<N>_tespit_okunan.json biçimidir.
   ===================================================================== */
const SURUM = '1.3';
const ZN = ['Toprak', 'Küskü', 'Y.Kaya', 'S.Kaya', 'Ç.S.Kaya'];
const ZRENK = ['#a1887f', '#d4a85a', '#8d9aa5', '#5c6f7c', '#2f3b44'];
const KODLAR = ['', 'KY', 'KP', 'L', 'D', 'S'];
const KOD_AD = { '': 'Normal', KY: 'Karşılaşma yeri (21 m)', KP: 'Kurp', L: 'Lase', D: 'Dere geçişi', S: 'Sandık yarma' };
const KHH = ['KP', 'L', 'S', 'D'];           // k, h, h₂ alanları açılan kodlar
const PRESET = [['100', [100]], ['90/10', [90, 10]], ['80/20', [80, 20]], ['70/30', [70, 30]],
  ['60/20/20', [60, 20, 20]], ['60/30/10', [60, 30, 10]], ['50/20/30', [50, 20, 30]], ['40/30/30', [40, 30, 30]]];
const ARTIFACT = !!(window.claude && typeof window.claude.use === 'function');

/* ---------------------------------------------------------- yardımcılar */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function num(v) {
  if (v === null || v === undefined) return null;
  if (typeof v === 'number') return isFinite(v) ? v : null;
  const s = String(v).trim().replace(/\s/g, '').replace(',', '.');
  if (s === '' || s === '-' || s === '.') return null;
  const n = Number(s);
  return isFinite(n) ? n : null;
}
const r2 = n => Math.round(n * 100) / 100;
function fmt(n, d = 2) { return n === null || n === undefined ? '' : Number(n).toLocaleString('tr-TR', { maximumFractionDigits: d }); }
function kmF(m) {
  if (m === null || m === undefined) return '—';
  const k = Math.floor(m / 1000), r = m - k * 1000;
  return `${k}+${r.toFixed(2).padStart(6, '0')}`;
}
const pad = n => String(n).padStart(2, '0');
function trTarih(d = new Date()) { return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()}`; }
function isoToTr(s) { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? `${m[3]}.${m[2]}.${m[1]}` : s; }
function trToIso(s) { const m = /^(\d{2})\.(\d{2})\.(\d{4})$/.exec(s || ''); return m ? `${m[3]}-${m[2]}-${m[1]}` : ''; }
function saat(iso) { if (!iso) return ''; const d = new Date(iso); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function zToplam(z) { return (z || []).reduce((a, b) => a + (num(b) || 0), 0); }
function zBos(z) { return !z || !z.some(x => num(x)); }
function zMetin(z) { if (zBos(z)) return ''; return z.map((v, i) => num(v) ? `${ZN[i]} ${fmt(v, 1)}` : null).filter(Boolean).join(' · '); }
function mesafe(a, b) {   // metre, haversine
  const R = 6371000, t = Math.PI / 180;
  const dLa = (b[0] - a[0]) * t, dLo = (b[1] - a[1]) * t;
  const x = Math.sin(dLa / 2) ** 2 + Math.cos(a[0] * t) * Math.cos(b[0] * t) * Math.sin(dLo / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function toast(t, ms = 2200) { const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), ms); }
function onay(metin, evet = 'Evet', tehlike = false) {
  return new Promise(res => {
    const d = document.createElement('div'); d.className = 'dlg';
    d.innerHTML = `<div><p>${metin}</p><div class="btns"><button class="btn" data-r="0">Vazgeç</button><button class="btn ${tehlike ? 'd' : 'p'}" data-r="1">${esc(evet)}</button></div></div>`;
    d.addEventListener('click', e => { const b = e.target.closest('[data-r]'); if (b || e.target === d) { d.remove(); res(b ? b.dataset.r === '1' : false); } });
    document.body.appendChild(d);
  });
}

/* ---------------------------------------------------------- depolama (IndexedDB, yedekli) */
const Depo = {
  db: null, mod: 'mem', mem: { k: {}, y: [] },
  p(r) { return new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  st(n, m = 'readonly') { return this.db.transaction(n, m).objectStore(n); },
  async ac() {
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('yeniYolSahaTespit', 2);
        r.onupgradeneeded = () => {
          const d = r.result;
          if (!d.objectStoreNames.contains('kayit')) d.createObjectStore('kayit', { keyPath: 'id' });
          if (!d.objectStoreNames.contains('yedek')) d.createObjectStore('yedek', { keyPath: 'n', autoIncrement: true }).createIndex('id', 'id');
          if (!d.objectStoreNames.contains('foto')) d.createObjectStore('foto', { keyPath: 'id' });
        };
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
        setTimeout(() => rej(new Error('idb zaman aşımı')), 4000);
      });
      this.mod = 'idb';
    } catch (e) {
      try { localStorage.setItem('_t', '1'); localStorage.removeItem('_t'); this.mod = 'ls'; } catch (e2) { this.mod = 'mem'; }
    }
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { }
  },
  lsK() { try { return JSON.parse(localStorage.getItem('yys_k') || '{}'); } catch (e) { return {}; } },
  async hepsi() {
    if (this.mod === 'idb') return this.p(this.st('kayit').getAll());
    if (this.mod === 'ls') return Object.values(this.lsK());
    return Object.values(this.mem.k);
  },
  async yaz(k) {
    k.guncelleme = new Date().toISOString();
    const v = JSON.parse(JSON.stringify(k));
    if (this.mod === 'idb') return this.p(this.st('kayit', 'readwrite').put(v));
    if (this.mod === 'ls') { const o = this.lsK(); o[k.id] = v; localStorage.setItem('yys_k', JSON.stringify(o)); return; }
    this.mem.k[k.id] = v;
  },
  async sil(id) {
    if (this.mod === 'idb') return this.p(this.st('kayit', 'readwrite').delete(id));
    if (this.mod === 'ls') { const o = this.lsK(); delete o[id]; localStorage.setItem('yys_k', JSON.stringify(o)); return; }
    delete this.mem.k[id];
  },
  async yedekle(k, neden) {
    const y = { id: k.id, zaman: new Date().toISOString(), neden, ozet: k.tur === 'soz' ? `${k.kod} sözleşme` : k.tur === 'sy' ? `Sanat yapısı ${(k.yollar || []).map(y => y.kod).join(',')} · ${(k.yapilar || []).length} imalat` : `${k.kod || '?'} HK${k.hk} · ${k.noktalar.length} nokta`, veri: JSON.stringify(k) };
    try {
      if (this.mod === 'idb') {
        await this.p(this.st('yedek', 'readwrite').add(y));
        const hep = await this.p(this.st('yedek').index('id').getAll(k.id));
        if (hep.length > 40) { const s = this.st('yedek', 'readwrite'); hep.slice(0, hep.length - 40).forEach(x => s.delete(x.n)); }
      } else if (this.mod === 'ls') {
        let a = []; try { a = JSON.parse(localStorage.getItem('yys_y') || '[]'); } catch (e) { }

/* ---------------------------------------------------------- kurallar / kontroller */
function kontrol(k) {

    if (p.u === null && p.y === null && p.alan === null) H.push({ i, m: `Nokta ${i + 1} (${kmF(p.km)}): u ya da y (ya da özel alan) yok` });
    const zemIst = i > 0 || p.ilkZemin;
    if (zemIst) {
      const dAraligi = on && on.tip === 'D';
      if (zBos(p.zemin)) { if (!dAraligi) H.push({ i, m: `Nokta ${i + 1} (${kmF(p.km)}): zemin yüzdeleri boş` }); }
      else if (Math.abs(zToplam(p.zemin) - 100) > 0.01) H.push({ i, m: `Nokta ${i + 1} (${kmF(p.km)}): zemin toplamı %${fmt(zToplam(p.zemin), 1)} (100 olmalı)` });
    } else if (!zBos(p.zemin)) U.push({ i, m: 'İlk noktada zemin yazılı; hakediş sisteminde yok sayılır' });
    if (['KP', 'L', 'S'].includes(p.tip) && p.k === null && p.h === null) U.push({ i, m: `Nokta ${i + 1}: ${p.tip} kodu var, k / h girilmemiş` });
  });
  const kSiz = P.filter(p => p.lat === null || p.lat === undefined).length;
  if (kSiz && !k.aktarildi) U.push({ i: P.findIndex(p => p.lat == null), m: kSiz === P.length ? 'Noktalarda koordinat yok' : `${kSiz} noktada koordinat alınamadı` });
  if (P.length && +k.hk === 1 && P[0].km !== 0) U.push({ i: 0, m: `1. hakediş: yol başlangıcı ${kmF(P[0].km)} (0+000 değil)` });
  if (P.length > 1 && P[P.length - 1].tip === 'D') U.push({ m: 'Son noktada D kodu var; dere geçişi bir sonraki tespitte kapanacak' });
  return { H, U };
}
function zeminDagilim(k) {
  const m = [0, 0, 0, 0, 0]; let bos = 0, top = 0;
  k.noktalar.forEach((p, i) => {
    if (i === 0 && !p.ilkZemin) return;

/* ---------------------------------------------------------- GPS */
function gpsGoster() {
  const e = $('#hGps'), c = S.konum;

function konumAl(zorla = false) {
  return new Promise(res => {
    if (!('geolocation' in navigator)) return res(null);
    if (!zorla && S.konum && Date.now() - S.konum.t < 15000) return res(S.konum);
    let bitti = false;
    const t = setTimeout(() => { if (!bitti) { bitti = true; res(S.konum); } }, 12000);
    try {
      navigator.geolocation.getCurrentPosition(p => {
        if (bitti) return; bitti = true; clearTimeout(t);
        S.konum = { lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy, t: Date.now() };
        gpsGoster(); res(S.konum);
      }, () => { if (!bitti) { bitti = true; clearTimeout(t); res(S.konum); } }, { enableHighAccuracy: true, timeout: 11000, maximumAge: 5000 });
    } catch (e) { bitti = true; clearTimeout(t); res(null); }
  });
}
async function wakeAl() {
  try { if ('wakeLock' in navigator && !S.wake) { S.wake = await navigator.wakeLock.request('screen'); S.wake.addEventListener('release', () => { S.wake = null; }); } } catch (e) { }
}

function izBaslat() {

  try {
    S.izId = navigator.geolocation.watchPosition(p => {

      gpsGoster();
      const kk = aktif(); if (!kk) return;
      if (p.coords.accuracy <= 40) {
        const son = kk.iz[kk.iz.length - 1];
        const yeni = [r6(S.konum.lat), r6(S.konum.lon), new Date().toISOString()];
        if (!son || mesafe(son, yeni) >= 3) {
          kk.iz.push(yeni);

          if (S.ekran === 'saha') { const e = $('#izBilgi'); if (e) e.textContent = izMetin(kk); }
        }
      }

    }, err => { toast('GPS hatası: ' + (err.code === 1 ? 'konum izni verilmedi' : err.message)); izDurdur(); },
      { enableHighAccuracy: true, maximumAge: 0, timeout: 30000 });
  } catch (e) { toast('GPS başlatılamadı'); return; }

}
function izDurdur() {
  if (S.izId !== null) { try { navigator.geolocation.clearWatch(S.izId); } catch (e) { } }
  S.izId = null;
  if (S.wake) { try { S.wake.release(); } catch (e) { } S.wake = null; }

}
const r6 = n => Math.round(n * 1e6) / 1e6;
function izUzunluk(iz) { let L = 0; for (let i = 1; i < iz.length; i++) L += mesafe(iz[i - 1], iz[i]); return L; }
function izMetin(k) { return k.iz.length ? `İz: ${k.iz.length} nokta · ${fmt(izUzunluk(k.iz) / 1000, 2)} km` : 'İz kaydı yok'; }

/* ---------------------------------------------------------- harita */
let HL = {};
function haritaKur() {
  const el = $('#map'); if (!el) return;
  const k = aktif();

}
function haritaLeaflet(el, k) {
  if (S.map) { S.map.remove(); S.map = null; }
  const map = L.map(el, { zoomControl: true, attributionControl: true, preferCanvas: false });
  S.map = map;

  } catch (e) { }
  HL = { iz: L.polyline([], { color: '#c62828', weight: 4, opacity: .85 }).addTo(map), nok: L.layerGroup().addTo(map), ben: null };

function haritaBen() {

// Leaflet yüklenemezse: basit şematik çizim (karo yok, kaydırma yok)
function haritaSvg(el, k) {
  const pts = k ? k.iz.map(p => [p[0], p[1]]).concat(k.noktalar.filter(p => p.lat != null).map(p => [p.lat, p.lon])) : [];
  if (!pts.length) { el.innerHTML = '<div class="empty">Harita kütüphanesi yüklenemedi.<br>İz ve noktalar burada şematik çizilecek.</div>'; return; }
  let a = Infinity, b = -Infinity, c = Infinity, d = -Infinity;
  pts.forEach(([la, lo]) => { a = Math.min(a, la); b = Math.max(b, la); c = Math.min(c, lo); d = Math.max(d, lo); });
  const W = 1000, Hh = 600, kx = Math.cos((a + b) / 2 * Math.PI / 180);
  const sx = (d - c) * kx || 1e-5, sy = (b - a) || 1e-5, s = Math.min((W - 60) / sx, (Hh - 60) / sy);
  const X = lo => 30 + (lo - c) * kx * s + ((W - 60) - sx * s) / 2, Y = la => Hh - 30 - (la - a) * s - ((Hh - 60) - sy * s) / 2;
  const iz = k.iz.map(p => `${X(p[1]).toFixed(1)},${Y(p[0]).toFixed(1)}`).join(' ');

}

/* ---- 2. Saha */
function ekSaha(m) {
  const k = aktif(); if (!k) return git('yollar');
  const P = k.noktalar, kt = kontrol(k);
  const hataI = new Set(kt.H.map(h => h.i)), uyI = new Set(kt.U.map(h => h.i));
  m.innerHTML = `
    <div id="map"></div>
    <div class="mut" id="izBilgi" style="margin-top:6px">${izMetin(k)}</div>
    <div class="mapbtns">
      ${S.izId === null ? `<button class="btn a" data-act="izBas">▶ İz kaydını başlat</button>` : `<button class="btn d" data-act="izDur">■ İz kaydını durdur</button>`}
      <button class="btn" data-act="ortala">◎ Konumuma git</button>
    </div>
    <button class="btn p big" data-act="noktaEkle">+ Nokta ekle${P.length ? ` <span style="font-weight:400;opacity:.85">(son ${kmF(P[P.length - 1].km)})</span>` : ''}</button>
    <div class="card" style="margin-top:10px;padding:4px 10px">
      ${P.length ? `<ul class="lst">${P.map((p, i) => `
        <li data-act="nokta" data-i="${i}">
          <span class="no" style="${p.tip === 'D' ? 'background:#1565c0' : ['KP', 'L', 'S'].includes(p.tip) ? 'background:#8e24aa' : p.tip === 'KY' ? 'background:var(--acc)' : ''}">${i + 1}</span>
          <span class="km">${kmF(p.km)}</span>
          <span class="z">${p.u !== null ? `u ${fmt(p.u)}` : p.y !== null ? `y %${fmt(p.y, 1)}` : p.alan !== null ? `alan ${fmt(p.alan)}` : '<b style="color:var(--err)">u/y yok</b>'}${p.tip ? ` · <b>${p.tip}</b>` : ''}<br>${(i === 0 && !p.ilkZemin) ? 'başlangıç' : zMetin(p.zemin) || (P[i - 1]?.tip === 'D' ? 'dere aralığı' : '<b style="color:var(--err)">zemin yok</b>')}</span>
          ${hataI.has(i) ? '<span class="tag e">!</span>' : uyI.has(i) ? '<span class="tag">?</span>' : ''}
        </li>`).join('')}</ul>` : '<div class="empty">Henüz nokta yok. Yol başlangıcında (0+000) ilk noktayı ekleyin.</div>'}
    </div>
    ${kt.H.length ? `<div class="msg e">${kt.H.length} hata — ayrıntı Özet ekranında</div>` : ''}`;
  haritaKur();
}

/* ---- Nokta girişi */
function noktaAc(i) {
  const k = aktif(); if (!k) return;
  const yeni = i === undefined || i === null;
  const P = k.noktalar;
  const idx = yeni ? P.length : i;
  const on = P[idx - 1], son = P[idx + 1];
  const p = yeni ? { km: null, u: null, y: null, egim: null, platform: null, hendek: null, tip: '', k: null, h: null, h2: null, zemin: null, alan: null, not: '', lat: null, lon: null, acc: null, zaman: null, ilkZemin: false }
    : JSON.parse(JSON.stringify(P[i]));
  if (!p.zemin) p.zemin = [null, null, null, null, null];
  let olcu = p.y !== null && p.u === null ? 'y' : 'u';
  const ilk = idx === 0;
  const sh = sayfa(yeni ? `Nokta ${idx + 1}` : `Nokta ${idx + 1} düzenle`, `
    <div class="sec">
      <div class="lbl">Kümülatif mesafe (m) <span class="mut">${on ? `önceki ${kmF(on.km)}` : 'yol başlangıcı'}</span></div>
      <input class="i huge" id="nKm" inputmode="decimal" autocomplete="off" placeholder="${on ? fmt(on.km + 20) : '0'}" value="${p.km === null ? '' : String(p.km).replace('.', ',')}">
      ${on ? `<div class="quick">${[10, 20, 25, 50].map(d => `<button data-dk="${d}">+${d}</button>`).join('')}</div>` : ''}
      <div class="mut" id="nKmBil" style="margin-top:6px"></div>
    </div>
    <div class="sec">
      <div class="lbl">Ölçü</div>
      <div class="seg" id="nOlcu"><button data-o="u">u — şev uzunluğu (m)</button><button data-o="y">y — yamaç eğimi (%)</button></div>
      <input class="i huge" id="nOl" inputmode="decimal" autocomplete="off" style="margin-top:8px">
    </div>
    <div class="sec">
      <div class="lbl">Kesit kodu <span class="mut" id="nKodAd"></span></div>
      <div class="grid5" style="grid-template-columns:repeat(6,1fr)" id="nKod">${KODLAR.map(c => `<button class="chip" data-k="${c}">${c || '—'}</button>`).join('')}</div>
      <div id="nKhh" class="row" style="margin-top:4px">
        <div><label class="f">k (m)</label><input class="i" id="nK" inputmode="decimal" value="${p.k ?? ''}"></div>
        <div><label class="f">h (m)</label><input class="i" id="nH" inputmode="decimal" value="${p.h ?? ''}"></div>
        <div><label class="f">h₂ (m)</label><input class="i" id="nH2" inputmode="decimal" value="${p.h2 ?? ''}"></div>
      </div>
      <div class="mut" id="nKodNot" style="margin-top:6px"></div>
    </div>
    <div class="sec" id="nZemSec">
      <div class="lbl">Zemin <span class="mut" id="nAra"></span></div>
      <div class="grid4" id="nPre">${PRESET.map(([t]) => `<button class="chip" data-p="${t}">${t}</button>`).join('')}
        <button class="chip acc" data-p="ayni" style="grid-column:span 2" ${on && !zBos(on.zemin) ? '' : 'disabled'}>Aynı</button>
        <button class="chip" data-p="ozel" style="grid-column:span 2">Özel / temizle</button></div>
      <div class="grid5" style="margin-top:10px">${ZN.map((z, j) => `<label class="zc"><span>${z}</span><input id="nZ${j}" inputmode="decimal" autocomplete="off"></label>`).join('')}</div>
      <div style="margin-top:8px;display:flex;justify-content:space-between;align-items:center"><span class="mut">Hazır oranlar Toprak → Küskü → Y.Kaya sırasıyla dolar.</span><span class="tot" id="nTot"></span></div>
    </div>
    ${ilk && +k.hk > 1 ? `<label class="sec" style="display:flex;gap:10px;align-items:center"><input type="checkbox" id="nIlkZ" ${p.ilkZemin ? 'checked' : ''} style="width:22px;height:22px"> <span>Bu nokta önceki hakedişin son noktası değil — öncesine ait zemini gir</span></label>` : ''}
    <details class="t" id="nTek" ${p.egim !== null || p.platform !== null || p.hendek || p.alan !== null || p.not ? 'open' : ''}>
      <summary>Teknik bilgiler (isteğe bağlı)</summary>
      <div class="row"><div><label class="f">Boyuna eğim (%)</label><input class="i" id="nEg" inputmode="decimal" value="${p.egim ?? ''}"></div>
      <div><label class="f">Platform (m)</label><input class="i" id="nPl" inputmode="decimal" value="${p.platform ?? ''}"></div></div>
      <label class="f">Hendek</label>
      <div class="seg" id="nHen"><button data-h="">—</button><button data-h="V">Var</button><button data-h="Y">Yok</button></div>
      <label class="f">Özel alan (m²)</label><input class="i" id="nAl" inputmode="decimal" value="${p.alan ?? ''}">
      <label class="f">Not</label><textarea class="i" id="nNot" rows="2">${esc(p.not || '')}</textarea>
      <div style="height:12px"></div>
    </details>
    <div class="sec gps" style="margin-top:12px"><span style="flex:1" id="nGps">Konum alınıyor…</span><button class="btn" style="min-height:40px;padding:6px 12px" id="nGpsY">Yenile</button></div>
    <div id="nMsg"></div>
    ${yeni ? '' : '<button class="btn d" id="nSil" style="width:100%;margin-top:6px">Noktayı sil</button>'}`,
    `<button class="btn" id="nKay">Kaydet</button><button class="btn p" id="nKayY" style="flex:1.4">Kaydet + yeni nokta</button>`);

  const $$ = s => $(s, sh);
  const kmI = $$('#nKm'), olI = $$('#nOl');
  // ölçü
  function olcuGoster() {
    sh.querySelectorAll('#nOlcu button').forEach(b => b.classList.toggle('on', b.dataset.o === olcu));
    olI.placeholder = olcu === 'u' ? 'u (m)' : 'y (%)';
    const v = olcu === 'u' ? p.u : p.y; olI.value = v === null ? '' : String(v).replace('.', ',');
  }
  $$('#nOlcu').onclick = e => { const b = e.target.closest('[data-o]'); if (!b) return; const v = num(olI.value); p.u = p.y = null; olcu = b.dataset.o; if (olcu === 'u') p.u = v; else p.y = v; olcuGoster(); };
  olI.oninput = () => { const v = num(olI.value); if (olcu === 'u') { p.u = v; p.y = null; } else { p.y = v; p.u = null; } };
  // kod
  function kodGoster() {
    sh.querySelectorAll('#nKod .chip').forEach(b => b.classList.toggle('on', b.dataset.k === (p.tip || '')));
    $$('#nKodAd').textContent = KOD_AD[p.tip || ''];
    $$('#nKhh').style.display = KHH.includes(p.tip) ? '' : 'none';
    $$('#nKodNot').textContent = p.tip === 'KY' ? 'Karşılaşma yeri bu noktadan itibaren 21 m.' : p.tip === 'D' ? 'Dere geçişi: k / h boş bırakılırsa kazı 0. Sonraki aralıkta zemin boş bırakılabilir.' : p.tip ? 'Kod bu noktadan bir sonraki noktaya kadar geçerli.' : '';
  }
  $$('#nKod').onclick = e => { const b = e.target.closest('[data-k]'); if (!b) return; p.tip = b.dataset.k; kodGoster(); };
  // zemin
  const zI = ZN.map((_, j) => $$('#nZ' + j));
  const zemGerekli = () => !ilk || ($$('#nIlkZ') && $$('#nIlkZ').checked);
  function zemGoster(yaz = true) {
    if (yaz) zI.forEach((e, j) => e.value = num(p.zemin[j]) ? String(p.zemin[j]).replace('.', ',') : '');
    const t = zToplam(p.zemin), bos = zBos(p.zemin), dAr = on && on.tip === 'D';
    const tt = $$('#nTot');
    tt.className = 'tot ' + (Math.abs(t - 100) < .01 || (bos && dAr) ? 'ok' : 'no');
    tt.textContent = bos ? (dAr ? 'boş (dere)' : 'Toplam 0') : `Toplam ${fmt(t, 1)}`;
    $$('#nZemSec').style.display = zemGerekli() ? '' : 'none';
    sh.querySelectorAll('#nPre [data-p]').forEach(b => {
      const pr = PRESET.find(x => x[0] === b.dataset.p);
      const es = pr ? ZN.every((_, j) => (num(p.zemin[j]) || 0) === (pr[1][j] || 0)) : b.dataset.p === 'ayni' && on && !bos && ZN.every((_, j) => (num(p.zemin[j]) || 0) === (num(on.zemin?.[j]) || 0));
      b.classList.toggle('on', !!es);
    });
  }
  $$('#nPre').onclick = e => {
    const b = e.target.closest('[data-p]'); if (!b || b.disabled) return;
    const v = b.dataset.p;
    if (v === 'ayni') p.zemin = [...on.zemin];
    else if (v === 'ozel') { p.zemin = [null, null, null, null, null]; zemGoster(); zI[0].focus(); return; }
    else { const pr = PRESET.find(x => x[0] === v)[1]; p.zemin = ZN.map((_, j) => pr[j] || null); }
    zemGoster();
  };
  zI.forEach((e, j) => e.oninput = () => { p.zemin[j] = num(e.value); zemGoster(false); });
  if ($$('#nIlkZ')) $$('#nIlkZ').onchange = () => zemGoster(false);
  // mesafe
  function kmBilgi() {
    const v = num(kmI.value), e = $$('#nKmBil');
    kmI.classList.remove('err');
    if (v === null) { e.textContent = ''; $$('#nAra').textContent = on ? `${kmF(on.km)} → ?` : ''; return; }
    let t = kmF(v);
    if (on) { const d = v - on.km; t += ` · aralık ${fmt(d)} m`; if (d <= 0) { kmI.classList.add('err'); t += ' — önceki noktadan büyük olmalı'; } }
    if (son && v >= son.km) { kmI.classList.add('err'); t += ` — sonraki nokta ${kmF(son.km)}'den küçük olmalı`; }
    e.textContent = t;
    $$('#nAra').textContent = on ? `${kmF(on.km)} → ${kmF(v)} (${fmt(v - on.km)} m)` : '';
  }
  kmI.oninput = kmBilgi;
  sh.querySelectorAll('[data-dk]').forEach(b => b.onclick = () => { kmI.value = String(r2(on.km + +b.dataset.dk)).replace('.', ','); kmBilgi(); });
  // hendek
  function henGoster() { sh.querySelectorAll('#nHen button').forEach(b => b.classList.toggle('on', b.dataset.h === (p.hendek || ''))); }
  $$('#nHen').onclick = e => { const b = e.target.closest('[data-h]'); if (!b) return; p.hendek = b.dataset.h || null; henGoster(); };
  // gps
  function gpsYaz() {
    const g = $$('#nGps');
    if (p.lat != null) g.innerHTML = `📍 <b>${p.lat.toFixed(6)}, ${p.lon.toFixed(6)}</b> ±${Math.round(p.acc || 0)} m · ${saat(p.zaman)}`;
    else g.textContent = ('geolocation' in navigator) ? 'Konum alınamadı (nokta yine kaydedilir)' : 'Bu cihazda konum yok';
  }
  async function gpsTaze(zorla) {
    $$('#nGps').textContent = 'Konum alınıyor…';
    const c = await konumAl(zorla);
    if (c) { p.lat = r6(c.lat); p.lon = r6(c.lon); p.acc = Math.round(c.acc); p.zaman = new Date().toISOString(); }
    if (sh.isConnected) gpsYaz();
  }
  $$('#nGpsY').onclick = () => gpsTaze(true);
  olcuGoster(); kodGoster(); zemGoster(); henGoster(); kmBilgi();
  if (yeni) { gpsTaze(false); setTimeout(() => kmI.focus(), 80); } else gpsYaz();
  if (!yeni && !p.zaman) p.zaman = new Date().toISOString();

  async function kaydetN(devam) {
    const msg = $$('#nMsg'); msg.innerHTML = '';
    const err = t => { msg.innerHTML = `<div class="msg e">${t}</div>`; msg.scrollIntoView({ block: 'center', behavior: 'smooth' }); };
    p.km = num(kmI.value);
    if (p.km === null) return err('Kümülatif mesafeyi girin.');
    if (p.km < 0) return err('Mesafe negatif olamaz.');
    if (on && !(p.km > on.km)) return err(`Mesafe önceki noktadan (${kmF(on.km)}) büyük olmalı.`);
    if (son && !(p.km < son.km)) return err(`Mesafe sonraki noktadan (${kmF(son.km)}) küçük olmalı.`);
    p.k = num($$('#nK').value); p.h = num($$('#nH').value); p.h2 = num($$('#nH2').value);
    if (!KHH.includes(p.tip)) p.k = p.h = p.h2 = null;
    p.egim = num($$('#nEg').value); p.platform = num($$('#nPl').value); p.alan = num($$('#nAl').value); p.not = $$('#nNot').value.trim();
    if (p.u === null && p.y === null && p.alan === null) return err('u ya da y değerini girin (ya da teknik bölümde özel alan).');
    p.ilkZemin = ilk ? !!($$('#nIlkZ') && $$('#nIlkZ').checked) : false;
    if (zemGerekli()) {
      const dAr = on && on.tip === 'D';
      if (zBos(p.zemin)) { if (!dAr) return err('Zemin yüzdelerini girin (hazır tuş, “Aynı” ya da özel).'); }
      else if (Math.abs(zToplam(p.zemin) - 100) > 0.01) return err(`Zemin toplamı %${fmt(zToplam(p.zemin), 1)} — 100 olmadan kaydedilmez.`);
    } else p.zemin = null;
    if (zBos(p.zemin)) p.zemin = null;
    if (yeni) P.push(p); else P[i] = p;
    await kaydet(k, yeni ? `nokta ${idx + 1} eklendi` : `nokta ${idx + 1} düzenlendi`);
    sh.kapat(); render();
    toast(`Nokta ${idx + 1} kaydedildi · ${kmF(p.km)}`);
    if (devam) noktaAc();
  }
  $$('#nKay').onclick = () => kaydetN(false);
  $$('#nKayY').onclick = () => kaydetN(true);
  if (!yeni) $$('#nSil').onclick = async () => {
    if (!await onay(`Nokta ${idx + 1} (${kmF(P[i].km)}) silinsin mi?${P[i + 1] ? '<br><span class="mut">Sonraki noktanın zemini artık daha uzun bir aralığa ait olacak; kontrol edin.</span>' : ''}`, 'Sil', true)) return;
    P.splice(i, 1); await kaydet(k, `nokta ${idx + 1} silindi`); sh.kapat(); render();
  };
}

/* ---- 4. Diğer imalatlar */
function ekImalat(m) {
  const k = aktif(); if (!k) return git('yollar');
  const bilinen = [...new Set(S.kayitlar.flatMap(x => x.imalat.map(i => i.poz)))];
  const so = sozAl(k.kod), elle = sozKalemler(so).filter(x => x.kaynak === 'ELLE');
  m.innerHTML = `
    <div class="card">
      <h2>Diğer imalatlar</h2>
      <div class="mut">Kazı dışındaki imalatlar (kök sökme vb.). Miktar <b>bu tespitteki</b> miktardır; hakediş sistemi önceki hakedişle toplar.</div>
      ${elle.length ? `<label class="f">Sözleşmedeki kalemler (dokunun)</label><div style="display:grid;gap:6px">${elle.map(x => `<button class="chip" style="text-align:left;padding:8px 10px;font-weight:500" data-act="imSec" data-poz="${esc(x.poz)}" data-ad="${esc(x.ad)}"><b>${esc(x.poz)}</b> · ${esc(x.ad)} <span class="mut">(${esc(x.birim)})</span></button>`).join('')}</div>` : so ? '' : '<div class="msg w" style="margin-top:8px">Sözleşme girilince elle kalemler burada seçilebilir.</div>'}
      <label class="f">Poz no</label><input class="i" id="iPoz" list="pozlar" autocomplete="off" placeholder="ör. OGM/…">
      <datalist id="pozlar">${bilinen.map(p => `<option value="${esc(p)}">`).join('')}</datalist>
      <div class="row"><div><label class="f">Açıklama (isteğe bağlı)</label><input class="i" id="iAc" autocomplete="off"></div>
      <div style="flex:.6"><label class="f">Miktar</label><input class="i" id="iMik" inputmode="decimal" autocomplete="off"></div></div>
      <button class="btn p big" style="margin-top:10px" data-act="imEkle">Ekle</button>
    </div>
    <div class="card" style="padding:4px 10px">
      ${k.imalat.length ? `<ul class="lst">${k.imalat.map((x, j) => `<li><span style="flex:1"><b>${esc(x.poz)}</b>${so && !sozKalemler(so).some(y => pozEs(y.poz, x.poz)) ? ' <span class="tag e">sözleşmede yok</span>' : ''}${x.aciklama ? `<br><span class="mut">${esc(x.aciklama)}</span>` : ''}</span><b>${fmt(x.miktar, 3)}</b><button class="btn d" style="min-height:38px;padding:6px 10px;flex:none" data-act="imSil" data-j="${j}">Sil</button></li>`).join('')}</ul>` : '<div class="empty">İmalat yok.</div>'}
    </div>`;
}

/* ---- 5. Özet / dışa aktar */
function ekOzet(m) {
  const k = aktif(); if (!k) return git('yollar');
  const P = k.noktalar, kt = kontrol(k), zd = zeminDagilim(k);
  const uz = P.length > 1 ? P[P.length - 1].km - P[0].km : 0;
  const kodlar = KODLAR.filter(Boolean).map(c => [c, P.filter(p => p.tip === c).length]).filter(x => x[1]);
  m.innerHTML = `
    <div class="card"><h2>${esc(k.kod)} · HK ${esc(k.hk)} · ${esc(k.tarih)}</h2>
      <div class="kv">
        <span>Nokta</span><b>${P.length}</b>
        <span>Aralık</span><b>${P.length ? `${kmF(P[0].km)} → ${kmF(P[P.length - 1].km)}` : '—'}</b>
        <span>Ölçülen uzunluk</span><b>${fmt(uz)} m</b>
        <span>GPS izi</span><b>${k.iz.length ? `${fmt(izUzunluk(k.iz))} m (${k.iz.length} nokta)` : '—'}</b>
        <span>Kesit kodları</span><b>${kodlar.length ? kodlar.map(x => `${x[0]} ×${x[1]}`).join(', ') : '—'}</b>
        <span>Diğer imalat</span><b>${k.imalat.length} kalem</b>
      </div>
    </div>
    <div class="card"><h2>Zemin dağılımı (uzunluk ağırlıklı)</h2>
      ${zd.top > 0 ? `<div class="bar">${zd.m.map((v, j) => v > 0 ? `<div style="width:${v / zd.top * 100}%;background:${ZRENK[j]}" title="${ZN[j]}"></div>` : '').join('')}${zd.bos > 0 ? `<div style="width:${zd.bos / zd.top * 100}%;background:repeating-linear-gradient(45deg,#90caf9 0 6px,#e3f2fd 6px 12px)"></div>` : ''}</div>
      <div class="leg">${zd.m.map((v, j) => v > 0 ? `<span><i style="background:${ZRENK[j]}"></i>${ZN[j]} <b>${fmt(v / zd.top * 100, 1)}%</b> (${fmt(v, 0)} m)</span>` : '').join('')}${zd.bos > 0 ? `<span><i style="background:#90caf9"></i>Dere (boş) ${fmt(zd.bos, 0)} m</span>` : ''}</div>` : '<div class="mut">Zemin girilmiş aralık yok.</div>'}
    </div>
    <div class="card"><h2>Kontroller</h2>
      ${!kt.H.length && !kt.U.length ? '<div class="msg o">Tüm kontroller tamam.</div>' : ''}
      ${kt.H.map(h => `<div class="msg e" ${h.i !== undefined ? `data-act="nokta" data-i="${h.i}" style="cursor:pointer"` : ''}>✕ ${h.m}</div>`).join('')}
      ${kt.U.map(h => `<div class="msg w" ${h.i !== undefined ? `data-act="nokta" data-i="${h.i}" style="cursor:pointer"` : ''}>! ${h.m}</div>`).join('')}
    </div>
    ${hkKart(k)}
    <div class="card"><h2>Saha tespiti dışa aktar</h2>
      ${kt.H.length ? '<div class="msg w">Hatalar giderilmeden de dışa aktarılabilir; hakediş sistemi aynı hataları durdurur.</div>' : ''}
      <div class="btns">
        <button class="btn p" data-act="xlsx">Excel indir</button>
        <button class="btn p" data-act="xlsxPay" ${ARTIFACT ? 'disabled' : ''}>Excel paylaş<br><span style="font-weight:400;font-size:12px">WhatsApp vb.</span></button>
        <button class="btn" data-act="json">JSON (sistem için)</button>
        <button class="btn" data-act="jsonPay" ${ARTIFACT ? 'disabled' : ''}>JSON paylaş</button>
        <button class="btn" data-act="kml">GPS izi (KML)</button>

}

async function indir(blob, ad) {
  if (ARTIFACT) {
    try {
      const d = await window.claude.use('downloads');
      if (d) { await d.save({ filename: ad, data: blob }); return true; }
    } catch (e) { console.warn(e); toast('İndirme iptal edildi / yapılamadı'); return false; }
  }
  try {
    const u = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = u; a.download = ad; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(u), 4000); return true;
  } catch (e) { toast('İndirilemedi'); return false; }
}
async function paylas(blob, ad, metin) {
  const f = new File([blob], ad, { type: blob.type });
  try {
    if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: ad, text: metin }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  toast('Bu tarayıcı dosya paylaşımını desteklemiyor — dosya indiriliyor');
  indir(blob, ad);
}
async function disaAktar(tur) {
  const k = aktif(); if (!k) return;
  if (tur === 'json' || tur === 'jsonPay') {
    const b = new Blob([JSON.stringify(jsonUret(k), null, 1)], { type: 'application/json' });
    return tur === 'json' ? indir(b, dosyaAdi(k, 'json')) : paylas(b, dosyaAdi(k, 'json'), `${k.kod} HK${k.hk} tespit (sistem)`);
  }
  if (tur === 'xlsx' || tur === 'xlsxPay') {
    let b = null; try { b = xlsxUret(k); } catch (e) { console.warn(e); }
    if (!b) { // SheetJS yüklenemediyse CSV
      toast('Excel kütüphanesi yüklenemedi — CSV verildi');
      const rows = [['Sira', 'Mesafe', 'u', 'y', 'Kod', 'k', 'h', 'h2', ...ZN, 'Not']].concat(k.noktalar.map((p, i) => [i + 1, p.km, p.u, p.y, p.tip, p.k, p.h, p.h2, ...((i === 0 && !p.ilkZemin) || zBos(p.zemin) ? ['', '', '', '', ''] : p.zemin), p.not]));
      const csv = '﻿' + rows.map(r => r.map(v => v === null || v === undefined ? '' : `"${String(v).replace(/"/g, '""')}"`).join(';')).join('\r\n');
      return indir(new Blob([csv], { type: 'text/csv' }), dosyaAdi(k, 'csv'));
    }
    return tur === 'xlsx' ? indir(b, dosyaAdi(k, 'xlsx')) : paylas(b, dosyaAdi(k, 'xlsx'), `${k.kod} ${k.ad || ''} — HK ${k.hk} saha tespiti (${k.tarih})`);
  }
  if (tur === 'kml' || tur === 'kmlPay') {
    if (!k.iz.length && !k.noktalar.some(p => p.lat != null)) return toast('İz kaydı ve koordinatlı nokta yok');
    const b = new Blob([kmlUret(k)], { type: 'application/vnd.google-earth.kml+xml' });
    return tur === 'kml' ? indir(b, dosyaAdi(k, 'kml')) : paylas(b, dosyaAdi(k, 'kml'), `${k.kod} HK${k.hk} GPS izi`);
  }
  if (tur === 'yazdir') {
    const h = formHtml(k);
    if (ARTIFACT) return indir(new Blob([h], { type: 'text/html' }), dosyaAdi(k, 'html'));
    const pa = $('#printArea');
    const doc = new DOMParser().parseFromString(h, 'text/html');
    pa.innerHTML = '';
    doc.querySelectorAll('style').forEach(s => { const st = document.createElement('style'); st.textContent = '@media print{' + s.textContent.replace(/@media screen\{[^}]*\}\}?/, '').replace(/(^|\})\s*body\{/g, '$1 #printArea{') + '}'; pa.appendChild(st); });
    pa.insertAdjacentHTML('beforeend', doc.body.innerHTML);
    setTimeout(() => { try { window.print(); } catch (e) { toast('Yazdırma açılamadı'); } }, 50);
  }
}

/* ---- hakediş için etüd zinciri (HK1..N) ---- */
function hkZincir(k) {
  const n = +k.hk, H = [], U = [], kayit = [];
  for (let j = 1; j <= n; j++) {
    const L = S.kayitlar.filter(x => x.kod === k.kod && +x.hk === j);
    if (!L.length) { H.push(`HK ${j} tespit kaydı bu cihazda yok`); continue; }
    if (L.length > 1 && !L.includes(k)) U.push(`HK ${j} için ${L.length} kayıt var; en son güncellenen kullanıldı`);
    kayit.push(L.includes(k) ? k : L.sort((a, b) => (b.guncelleme || '').localeCompare(a.guncelleme || ''))[0]);
  }
  if (H.length) return { H, U, satir: [], kayit };
  const satir = [];
  for (const r of kayit) {
    const kt = kontrol(r);
    kt.H.forEach(h => H.push(`HK ${r.hk}: ${h.m}`));
    let P = r.noktalar.map(p => ({ ...p, zemin: zBos(p.zemin) ? null : p.zemin.map(v => num(v) || null) }));
    if (satir.length && P.length) {
      const son = satir[satir.length - 1], f0 = P[0];
      if (Math.abs(f0.km - son.km) < 0.005) P = P.slice(1);
      else if (f0.km < son.km) H.push(`HK ${r.hk}: ${kmF(f0.km)} ile başlıyor, HK ${son.hk} ${kmF(son.km)}'de bitmiş (çakışma)`);
      else if (zBos(f0.zemin)) H.push(`HK ${r.hk}: önceki hakediş ${kmF(son.km)}'de bitmiş, bu tespit ${kmF(f0.km)}'den başlıyor; aradaki zemin yok`);
    } else if (!satir.length && P.length) P[0].zemin = null;
    P.forEach(p => { p.hk = +r.hk; satir.push(p); });
  }
  for (let i = 1; i < satir.length; i++) if (zBos(satir[i].zemin) && satir[i - 1].tip === 'D') {
    satir[i].zemin = [100, null, null, null, null];
    U.push(`${kmF(satir[i - 1].km)}–${kmF(satir[i].km)} dere geçişi: zemin yok, tesviye için toprak %100 alındı (kazı 0)`);
  }
  if (satir.length > 400) H.push(`Etüd karnesi kapasitesi (400 nokta) aşılıyor`);
  return { H, U, satir, kayit };
}

/* ---- hakediş Excel'i üret ---- */
async function hakedisUret(k) {
  const s = sozAl(k.kod), E = sozEksik(s);
  if (E.length) throw new Error('Sözleşme eksik: ' + E.slice(0, 4).join(', ') + (E.length > 4 ? ` (+${E.length - 4})` : ''));
  const z = hkZincir(k);
  if (z.H.length) throw new Error(z.H.slice(0, 4).join(' · '));
  const n = +k.hk;
  if (n > 12) throw new Error('Şablon en çok 12 hakediş tutar');
  const K = sozKalemler(s);
  const kb = await Kitap.ac(await sablonAl());
  // VERİLER
  kb.yazAd('V_Seflik', k.seflik || null); kb.yazAd('V_YolKod', String(k.kod)); kb.yazAd('V_YolAdi', k.ad || null);
  SOZ_ALAN.forEach(([, L]) => L.forEach(([key, , tur, , vn]) => {
    let v = s[key];
    if (v === null || v === undefined || v === '') return;
    if (tur === 'tarih') v = trSeri(v); else if (tur === 'sayi') v = num(v); else if (tur === 'yuzde') v = num(v) / 100;
    if (v === null) return;
    kb.yazAd(vn, v);
  }));
  // SÖZLEŞME (sıkıştırılmış)
  for (let i = 0; i < 25; i++) {
    const x = K[i];
    kb.yazAd('S_Poz', x ? x.poz : null, i); kb.yazAd('S_Ad', x ? x.ad : null, i); kb.yazAd('S_Birim', x ? x.birim : null, i);
    kb.yazAd('S_Q0', x ? num(x.miktar) : null, i); kb.yazAd('S_BF', x ? num(x.bf) : null, i);
    kb.yazAd('S_Kaynak', x ? x.kaynak : null, i); kb.yazAd('S_Ust', x ? num(x.ust) : null, i);
  }
  // HAKEDİŞLER
  z.kayit.forEach(r => {
    const j = +r.hk - 1;
    kb.yazAd('G_Tarih', trSeri(r.tarih), 0, j);
    kb.yazAd('G_Tur', r === k ? (k.hkTur || 'ARA') : (r.hkTur || 'ARA'), 0, j);
    if (num(r.hkSgk)) kb.yazAd('G_SGK', num(r.hkSgk), 0, j);
    if (num(r.hkMakine)) kb.yazAd('G_Makine', num(r.hkMakine), 0, j);
    if (num(r.hkAvans)) kb.yazAd('G_Avans', num(r.hkAvans), 0, j);
  });
  // ETÜD KARNESİ
  const [es, ] = kb.hucre('E_Km'), r0 = kb.ref('E_Km').r1, hkKol = kolAd(kb.ref('E_Hk').c1);
  z.satir.forEach((p, i) => {
    const r = r0 + i, w = (c, v) => kb.yaz(es, c + r, v === undefined ? null : v);
    w('B', p.km); w('D', p.u); w('E', p.y); w('F', p.egim); w('G', p.platform);
    w('H', p.hendek === 'V' ? 'VAR' : p.hendek === 'Y' ? 'YOK' : null); w('I', KOD_TAM[p.tip || ''] || null);
    w('J', p.k); w('K', p.h); w('L', p.h2);
    'MNOPQ'.split('').forEach((c, j) => w(c, i === 0 || !p.zemin ? null : (num(p.zemin[j]) || null)));
    w('R', p.alan); w('S', p.not || null); w(hkKol, p.hk);
  });
  // MİKTARLAR — ELLE kalemlerin kümülatif miktarı
  const uy = [...z.U], cum = {};
  z.kayit.forEach(r => {
    const j = +r.hk;
    (r.imalat || []).forEach(im => {
      const i = K.findIndex(x => pozEs(x.poz, im.poz));
      if (i < 0) { if (r === k) uy.push(`İmalat ${im.poz} sözleşmede yok — aktarılmadı`); return; }
      cum[i] = (cum[i] || 0) + (num(im.miktar) || 0);
    });
    Object.entries(cum).forEach(([i, v]) => kb.yazAd('MK_Elle', Math.round(v * 1000) / 1000, +i, j - 1));
  });
  const blob = await kb.kaydet();
  return { blob, uyarilar: uy, ad: hkDosyaAdi(k, s) };
}
function hkDosyaAdi(k, s) { return `${String(k.kod).replace(/[\\/:*?"<>|\s]+/g, '_')}_${trUp(s?.isletme || 'İŞLETME').replace(/\s+/g, '_')}_YENİYOL_HK${k.hk}.xlsx`; }

/* ---- mevcut hakediş dosyasından içe alma (sözleşme + önceki tespitler) ---- */
async function hkDosyaIceAl(u8, adi) {
  const kb = await Kitap.ac(u8);
  if (!kb.adlar.V_YolKod || !kb.adlar.E_Km) throw new Error('Bu dosya Yeni Yol hakediş şablonu değil');
  const v = nm => kb.oku(nm);
  const kod = String((await v('V_YolKod')) ?? '').trim();
  if (!kod) throw new Error('Dosyada yol kodu yok');
  const seflik = (await v('V_Seflik')) || '', ad = (await v('V_YolAdi')) || '';
  const s = { id: sozId(kod), tur: 'soz', kod, kalemler: [] };
  for (const [, L] of SOZ_ALAN) for (const [key, , tur, , vn] of L) {
    let x = await v(vn); if (x === null || x === '') continue;
    if (tur === 'tarih') x = typeof x === 'number' ? seriTr(x) : String(x);
    else if (tur === 'yuzde') x = Math.round(x * 1e6) / 1e4;
    else if (tur === 'metin') x = String(x);
    s[key] = x;
  }
  for (let i = 0; i < 25; i++) {
    const poz = await kb.oku('S_Poz', i); if (!poz) continue;
    s.kalemler.push({ poz: String(poz), ad: String((await kb.oku('S_Ad', i)) || ''), birim: String((await kb.oku('S_Birim', i)) || ''),
      kaynak: trUp((await kb.oku('S_Kaynak', i)) || 'ELLE'), miktar: num(await kb.oku('S_Q0', i)), bf: num(await kb.oku('S_BF', i)), ust: num(await kb.oku('S_Ust', i)) });
  }
  // hakediş geçmişi
  const tar = [];
  for (let j = 0; j < 12; j++) { const t = await kb.oku('G_Tarih', 0, j); if (t !== null && t !== '') tar[j] = typeof t === 'number' ? seriTr(t) : String(t); }
  const son = tar.length;
  const er = kb.ref('E_Km'), es = er.sayfa, H = await kb.harita(es), hkKol = kolAd(kb.ref('E_Hk').c1);
  const pts = [];
  for (let r = er.r1; r <= er.r2; r++) {
    const g = c => H[c + r] ?? null; if (g('B') === null) continue;
    const hk = num(g(hkKol)) || Math.max(son, 1);
    const tip = KOD_KISA[trUp(g('I') || '')] ?? '';
    const hd = trUp(g('H') || '');
    const zm = 'MNOPQ'.split('').map(c => num(g(c)));
    pts.push({ km: num(g('B')), u: num(g('D')), y: num(g('E')), egim: num(g('F')), platform: num(g('G')), hendek: hd.startsWith('V') ? 'V' : hd.startsWith('Y') ? 'Y' : null,
      tip, k: num(g('J')), h: num(g('K')), h2: num(g('L')), zemin: zm.some(x => x) ? zm : null, alan: num(g('R')), not: g('S') ? String(g('S')) : '',
      lat: null, lon: null, acc: null, zaman: null, ilkZemin: false, _hk: hk });
  }
  const yeniK = [];
  if (son) for (let j = 1; j <= son; j++) {
    const P = pts.filter(p => p._hk === j).map(({ _hk, ...p }) => p);
    if (j > 1 && P.length && !zBos(P[0].zemin)) P[0].ilkZemin = true;
    const imalat = [];
    for (let i = 0; i < s.kalemler.length; i++) {
      const c = num(await kb.oku('MK_Elle', i, j - 1)), o = j > 1 ? num(await kb.oku('MK_Elle', i, j - 2)) : null;
      // boş hücre önceki hakedişin miktarını taşır
      let cur = c, onc = 0;
      if (j > 1) { for (let q = j - 2; q >= 0; q--) { const x = num(await kb.oku('MK_Elle', i, q)); if (x !== null) { onc = x; break; } } }
      if (cur === null) continue;
      const d = Math.round((cur - onc) * 1000) / 1000;
      if (d) imalat.push({ poz: s.kalemler[i].poz, aciklama: s.kalemler[i].ad, miktar: d });
    }
    const tur = await kb.oku('G_Tur', 0, j - 1);
    yeniK.push({ id: uid(), kod, seflik, ad, hk: j, tarih: tar[j - 1] || trTarih(), noktalar: P, imalat, iz: [], hkTur: trUp(tur || 'ARA') === 'SON' ? 'SON' : 'ARA',
      aktarildi: adi, olusturma: new Date().toISOString() });
  }
  return { s, kayitlar: yeniK, kod, seflik, ad, son, nokta: pts.length };
}

      <button class="btn a" data-act="hkPay" ${E.length || z.H.length || ARTIFACT ? 'disabled' : ''}>Hakediş paylaş<br><span style="font-weight:400;font-size:12px">WhatsApp vb.</span></button>
    </div>
    <div class="mut" style="margin-top:8px">Dosya hakediş şablonunun tamamıdır (rapor, icmal, yapılan işler…). Tutarlar dosya Excel'de açılınca hesaplanır.</div>
  </div>`;
}
async function hkCikti(paylas_) {
  const k = aktif(); if (!k) return;
  toast('Hakediş hazırlanıyor…', 4000);
  try {
    const r = await hakedisUret(k);
    if (r.uyarilar.length) toast(r.uyarilar[0], 4000);
    if (paylas_) await paylas(r.blob, r.ad, `${k.kod} ${k.ad || ''} — ${k.hk} nolu ${k.hkTur === 'SON' ? 'son' : 'ara'} hakediş`);
    else await indir(r.blob, r.ad);
  } catch (e) { console.error(e); toast('Hakediş üretilemedi: ' + e.message, 6000); }

        zemin: zBos(p.zemin) ? null : (p.zemin || []).slice(0, 5).map(num), alan: num(p.alan), not: p.not || '', lat: num(p.lat), lon: num(p.lon), acc: null, zaman: p.zaman || null, ilkZemin: i === 0 && !zBos(p.zemin) })),
      imalat, iz: Array.isArray(d.iz) ? d.iz : [], olusturma: new Date().toISOString() }];
  } else return toast('Tanınmayan dosya biçimi');
  let n = 0;
  for (const k of gelen) {
    const var_ = S.kayitlar.find(x => x.id === k.id);
    if (var_) { if (!await onay(`${esc(k.kod)} HK ${esc(k.hk)} cihazda var. Üzerine yazılsın mı?`, 'Üzerine yaz', true)) continue; Object.assign(var_, k); await kaydet(var_, 'içe alındı'); }
    else { S.kayitlar.push(k); await kaydet(k, 'içe alındı'); }
    n++;
  }
  toast(`${n} kayıt içe alındı`); render();
}
async function yedekListe() {
  const y = await Depo.yedekler();
  const sh = sayfa('Otomatik yedekler', y.length ? `<div class="card" style="padding:4px 10px"><ul class="lst">${y.slice(0, 120).map((x, j) => `<li data-y="${j}"><span style="flex:1"><b>${esc(x.ozet)}</b><br><span class="mut">${new Date(x.zaman).toLocaleString('tr-TR')} · ${esc(x.neden || '')}</span></span><span class="tag">Geri yükle</span></li>`).join('')}</ul></div>` : '<div class="empty">Yedek yok.</div>', '');
  sh.addEventListener('click', async e => {
    const li = e.target.closest('[data-y]'); if (!li) return;
    const x = y[+li.dataset.y], k = JSON.parse(x.veri);
    if (!await onay(`<b>${esc(x.ozet)}</b><br>${new Date(x.zaman).toLocaleString('tr-TR')} yedeği geri yüklensin mi? Mevcut hali önce yedeklenir.`, 'Geri yükle')) return;
    if (k.tur === 'soz') { S.soz[k.id] = k; await kaydet(k); sh.kapat(); toast('Sözleşme geri yüklendi'); render(); return; }
    if (k.tur === 'sy') { const ms = S.syIsler.find(z => z.id === k.id); if (ms) { await Depo.yedekle(ms, 'geri yüklemeden önce'); Object.assign(ms, k); await kaydet(ms); } else { S.syIsler.push(k); await kaydet(k); } S.mod = 'sy'; S.syAktifId = k.id; sh.kapat(); toast('Geri yüklendi (fotoğraflar hariç)'); git('saha'); return; }
    const mev = S.kayitlar.find(z => z.id === k.id);
    if (mev) { await Depo.yedekle(mev, 'geri yüklemeden önce'); Object.assign(mev, k); await kaydet(mev); }
    else { S.kayitlar.push(k); await kaydet(k); }
    S.aktif = k.id; sh.kapat(); toast('Geri yüklendi'); git('saha');
  });
}
